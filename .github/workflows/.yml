            const o=$('kbo');if(!o||m===kboOn)return;kboOn=m;
            o.querySelectorAll('i').forEach(i=>i.classList.toggle('on',((m>>(+i.dataset.d))&1)===1))
          };

          /* ===== effets : pluie (gouttes sur l'ecran) et tempete (pluie + tonnerre) ; canvas leger, ne bloque jamais le toucher ===== */
          const FX={raf:0,drops:[],st:[],acc:0,fl:0,bolt:null,nb:0,last:0,cv:null,cx:null};
          function fxSize(){const c=FX.cv,d=Math.min(window.devicePixelRatio||1,2),w=innerWidth,hh=innerHeight;
            if(c.width!==Math.round(w*d)||c.height!==Math.round(hh*d)){c.width=Math.round(w*d);c.height=Math.round(hh*d)}
            FX.cx.setTransform(c.width/w,0,0,c.height/hh,0,0)}
          function paintFx(){
            const on=!!S.fxMode&&S.fxMode!=='off';let c=$('fx');
            if(!on){if(c)c.style.display='none';if(FX.raf){cancelAnimationFrame(FX.raf);FX.raf=0}FX.drops=[];FX.st=[];FX.fl=0;FX.bolt=null;return}
            if(!c){c=document.createElement('canvas');c.id='fx';document.body.insertBefore(c,document.body.firstChild);FX.cv=c;FX.cx=c.getContext('2d')}
            c.style.display='block';c.style.opacity=(S.fxOp==null?70:S.fxOp)/100;fxSize();
            if(!FX.raf){FX.last=performance.now();FX.nb=FX.last+3500;FX.raf=requestAnimationFrame(fxLoop)}
          }
          function fxBolt(w,hh){
            let x=w*(.15+Math.random()*.7),y=0;const pts=[[x,y]],br=[];const end=hh*(.45+Math.random()*.25);
            while(y<end){y+=16+Math.random()*26;x+=(Math.random()-.5)*46;pts.push([x,y]);
              if(Math.random()<.14){let bx=x,by=y;const b=[[bx,by]];for(let k=0;k<4;k++){by+=12+Math.random()*16;bx+=(Math.random()<.5?-1:1)*(6+Math.random()*18);b.push([bx,by])}br.push(b)}}
            return{pts,br}
          }
          const FXM={snow:1,petals:1,fire:1,stars:1,bubbles:1,confetti:1,embers:1,matrix:1};
          const FXC=['#ff5a5f','#ffd23f','#3bceac','#4d96ff','#c77dff','#ff9f1c'];
          function fxExtra(m,dt,c,w,hh,it){
            const P=FX.p||(FX.p=[]),s=dt/1000;
            if(FX.pm!==m){FX.pm=m;P.length=0;FX.cols=null;FX.sh=null}
            const want=Math.round(12+110*it),R=Math.random;
            if(m==='matrix'){
              const n=Math.ceil(w/16);if(!FX.cols||FX.cols.length!==n)FX.cols=Array.from({length:n},()=>({y:R()*hh,v:60+R()*140}));
              c.font='14px monospace';
              FX.cols.forEach((k,i)=>{k.y+=k.v*s;if(k.y-150>hh){k.y=-R()*200;k.v=60+R()*140}
                for(let t=0;t<9;t++){const y=k.y-t*16;if(y<-16||y>hh+16)continue;c.fillStyle=t?'rgba(60,255,120,'+(.7-t*.07)+')':'rgba(220,255,230,.95)';c.fillText(String.fromCharCode(0x30A0+((i*7+t*13+Math.floor(k.y/16))%64)),i*16,y)}});
              return}
            if(m==='stars'){
              if(!FX.sh){FX.sh=Array.from({length:Math.round(30+90*it)},()=>({x:R()*w,y:R()*hh,r:.5+R()*1.4,ph:R()*6.28,sp:.8+R()*2}))}
              FX.t=(FX.t||0)+s;
              for(const q of FX.sh){const a=.35+.65*(.5+.5*Math.sin(FX.t*q.sp+q.ph));c.fillStyle='rgba(255,255,255,'+a+')';c.beginPath();c.arc(q.x,q.y,q.r,0,6.2832);c.fill()}
              FX.ns=(FX.ns==null?2:FX.ns)-s;if(FX.ns<=0&&!FX.sx){FX.sx={x:R()*w*.7,y:R()*hh*.35,a:0};FX.ns=3+R()*5}
              if(FX.sx){const q=FX.sx;q.a+=s;q.x+=520*s;q.y+=300*s;const al=Math.max(0,1-q.a/.8);c.strokeStyle='rgba(255,255,255,'+al+')';c.lineWidth=1.6;c.beginPath();c.moveTo(q.x,q.y);c.lineTo(q.x-70,q.y-40);c.stroke();if(q.a>.8)FX.sx=null}
              return}
            while(P.length<want){
              if(m==='snow')P.push({x:R()*w,y:-6,r:1+R()*2.6,vy:28+R()*50,ph:R()*6.28,a:0});
              else if(m==='petals')P.push({x:R()*w,y:-10,r:3+R()*3,vy:30+R()*40,ph:R()*6.28,rot:R()*6.28,vr:(R()-.5)*3,a:0});
              else if(m==='fire')P.push({x:R()*w,y:R()*hh,r:1.4+R()*1.8,vx:(R()-.5)*20,vy:(R()-.5)*20,ph:R()*6.28,a:0});
              else if(m==='bubbles')P.push({x:R()*w,y:hh+14,r:4+R()*12,vy:-(25+R()*50),ph:R()*6.28,a:0});
              else if(m==='confetti')P.push({x:R()*w,y:-10,r:3+R()*3,vy:90+R()*110,ph:R()*6.28,rot:R()*6.28,vr:(R()-.5)*9,col:FXC[Math.floor(R()*FXC.length)],a:0});
              else P.push({x:R()*w,y:hh+6,r:.8+R()*1.8,vx:(R()-.5)*30,vy:-(40+R()*90),ph:R()*6.28,life:1.4+R()*1.8,a:0});
            }
            if(P.length>want)P.length=want;
            for(let i=P.length-1;i>=0;i--){const p=P[i];p.a+=s;let dead=false;
              if(m==='snow'){p.y+=p.vy*s;p.x+=Math.sin(p.a*1.3+p.ph)*18*s;dead=p.y>hh+8;c.fillStyle='rgba(255,255,255,.85)';c.beginPath();c.arc(p.x,p.y,p.r,0,6.2832);c.fill()}
              else if(m==='petals'){p.y+=p.vy*s;p.x+=Math.sin(p.a*1.1+p.ph)*30*s;p.rot+=p.vr*s;dead=p.y>hh+10;c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.fillStyle='rgba(255,170,200,.85)';c.beginPath();c.ellipse(0,0,p.r*1.5,p.r*.8,0,0,6.2832);c.fill();c.restore()}
              else if(m==='fire'){p.x+=p.vx*s+Math.sin(p.a+p.ph)*8*s;p.y+=p.vy*s+Math.cos(p.a*.8+p.ph)*8*s;if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>hh)p.vy*=-1;const al=.25+.75*(.5+.5*Math.sin(p.a*2.2+p.ph));c.save();c.shadowColor='rgba(220,255,120,'+al+')';c.shadowBlur=10;c.fillStyle='rgba(235,255,150,'+al+')';c.beginPath();c.arc(p.x,p.y,p.r,0,6.2832);c.fill();c.restore()}
              else if(m==='bubbles'){p.y+=p.vy*s;p.x+=Math.sin(p.a*1.5+p.ph)*14*s;dead=p.y<-20;c.strokeStyle='rgba(255,255,255,.5)';c.lineWidth=1;c.fillStyle='rgba(200,230,255,.08)';c.beginPath();c.arc(p.x,p.y,p.r,0,6.2832);c.fill();c.stroke();c.fillStyle='rgba(255,255,255,.7)';c.beginPath();c.arc(p.x-p.r*.35,p.y-p.r*.35,p.r*.2,0,6.2832);c.fill()}
              else if(m==='confetti'){p.y+=p.vy*s;p.x+=Math.sin(p.a*2+p.ph)*30*s;p.rot+=p.vr*s;dead=p.y>hh+10;c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.fillStyle=p.col;c.fillRect(-p.r,-p.r*.5,p.r*2,p.r);c.restore()}
              else{p.x+=p.vx*s+Math.sin(p.a*3+p.ph)*10*s;p.y+=p.vy*s;dead=p.a>p.life||p.y<-8;const al=Math.max(0,1-p.a/p.life);c.save();c.shadowColor='rgba(255,120,30,'+al+')';c.shadowBlur=8;c.fillStyle='rgba('+(255)+','+Math.round(120+100*al)+',40,'+al+')';c.beginPath();c.arc(p.x,p.y,p.r,0,6.2832);c.fill();c.restore()}
              if(dead)P.splice(i,1)}
          }
          function fxLoop(t){
            FX.raf=requestAnimationFrame(fxLoop);
            const dt=Math.min(50,t-FX.last);FX.last=t;
            const c=FX.cx,w=innerWidth,hh=innerHeight,it=(S.fxInt==null?40:S.fxInt)/100,storm=S.fxMode==='storm';
            if(FX.cv.width!==Math.round(w*Math.min(window.devicePixelRatio||1,2)))fxSize();
            c.clearRect(0,0,w,hh);
            if(FXM[S.fxMode]){fxExtra(S.fxMode,dt,c,w,hh,it);return}
            /* gouttes posees sur l'ecran : apparaissent, glissent parfois, s'effacent */
            FX.acc+=(6+46*it)*dt/1000;
            while(FX.acc>=1){FX.acc--;if(FX.drops.length<170)FX.drops.push({x:Math.random()*w,y:Math.random()*hh,r:1.1+Math.random()*2.4,a:0,life:2200+Math.random()*3400,v:Math.random()<.3?(10+Math.random()*26):0,ty:0})}
            for(let i=FX.drops.length-1;i>=0;i--){const d=FX.drops[i];d.a+=dt;const k=d.a/d.life;if(k>=1){FX.drops.splice(i,1);continue}
              if(d.v){d.y+=d.v*dt/1000;d.ty=Math.min(34,d.ty+d.v*dt/1000)}
              const al=k<.12?k/.12:(k>.7?(1-k)/.3:1),r=d.r*(k<.12?.5+k*4:1);
              if(d.ty>2){c.strokeStyle='rgba(255,255,255,'+(.16*al)+')';c.lineWidth=Math.max(1,r*.7);c.beginPath();c.moveTo(d.x,d.y-d.ty);c.lineTo(d.x,d.y);c.stroke()}
              c.fillStyle='rgba(215,230,255,'+(.16*al)+')';c.beginPath();c.arc(d.x,d.y,r,0,6.2832);c.fill();
              c.strokeStyle='rgba(255,255,255,'+(.42*al)+')';c.lineWidth=.8;c.stroke();
              c.fillStyle='rgba(255,255,255,'+(.8*al)+')';c.beginPath();c.arc(d.x-r*.3,d.y-r*.35,Math.max(.5,r*.28),0,6.2832);c.fill()}
            if(storm){
              const want=Math.round(18+90*it);while(FX.st.length<want)FX.st.push({x:Math.random()*(w+60),y:Math.random()*hh,v:900+Math.random()*600,l:14+Math.random()*16});
              if(FX.st.length>want)FX.st.length=want;
              c.strokeStyle='rgba(205,220,255,.3)';c.lineWidth=1;c.beginPath();
              for(const s of FX.st){s.y+=s.v*dt/1000;s.x-=s.v*.18*dt/1000;if(s.y>hh+s.l||s.x<-30){s.y=-s.l;s.x=Math.random()*(w+60)}c.moveTo(s.x,s.y);c.lineTo(s.x+s.l*.18,s.y-s.l)}
              c.stroke();
              if(t>=FX.nb){FX.fl=1;FX.bolt=fxBolt(w,hh);FX.nb=t+(16000-(S.fxTh||4)*1300)*(.6+Math.random()*.8)}
              if(FX.fl>0){
                c.fillStyle='rgba(205,220,255,'+(FX.fl*.2)+')';c.fillRect(0,0,w,hh);
                if(FX.bolt){c.save();c.lineJoin='round';c.lineCap='round';c.shadowColor='rgba(170,200,255,'+FX.fl+')';c.shadowBlur=14;c.strokeStyle='rgba(255,255,255,'+Math.min(1,FX.fl*1.2)+')';
                  const path=p=>{c.beginPath();p.forEach((q,i)=>i?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1]));c.stroke()};
                  c.lineWidth=2.4;path(FX.bolt.pts);c.lineWidth=1.3;FX.bolt.br.forEach(path);c.restore()}
                FX.fl-=dt/380;if(FX.fl<=0){FX.fl=0;FX.bolt=null}
              }
            }else{FX.fl=0;FX.bolt=null}
          }
          </script>
          </body>
          </html>

