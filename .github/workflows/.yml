          static CFTimeInterval gHudEvT = -100;


          static CGPoint bysgBoostPoint(int i, UIWindow *w) {
            UIView *s = boostSq[i];
            return s ? s.center : CGPointMake(w.bounds.size.width * 0.14, w.bounds.size.height * (0.70 + 0.065 * i));
          }

          static void bysgSetIvarObj(id o, NSString *key, id v) { @try { [o setValue:v forKey:key]; } @catch (__unused id e) {} }

          static UITouch *bysgNewTouch(void) {
            UITouch *t = nil;
            @try { t = [[UITouch alloc] init]; } @catch (__unused id e) {}
            return t;
          }

          static void bysgConfigTouch(UITouch *t, UIWindow *w, UIView *target, CGPoint pw, UITouchPhase ph, BOOL first) {
            bysgSetIvarObj(t, @"window", w);
            bysgSetIvarObj(t, @"view", target);
            bysgSetIvarObj(t, @"tapCount", @1);
            bysgSetIvarObj(t, @"phase", @(ph));
            bysgSetIvarObj(t, @"timestamp", @([NSProcessInfo processInfo].systemUptime));
            SEL sl = NSSelectorFromString(@"_setLocationInWindow:resetPrevious:");
            if ([t respondsToSelector:sl]) {
              NSInvocation *inv = [NSInvocation invocationWithMethodSignature:[t methodSignatureForSelector:sl]];
              inv.target = t; inv.selector = sl;
              [inv setArgument:&pw atIndex:2];
              BOOL reset = first; [inv setArgument:&reset atIndex:3];
              [inv invoke];
            }
            SEL sf = NSSelectorFromString(@"_setIsFirstTouchForView:");
            if ([t respondsToSelector:sf]) {
              NSInvocation *inv = [NSInvocation invocationWithMethodSignature:[t methodSignatureForSelector:sf]];
              inv.target = t; inv.selector = sf;
              BOOL f = first; [inv setArgument:&f atIndex:2];
              [inv invoke];
            }
          }

          static UIEvent *bysgTouchesEvent(NSSet *touches) {
            UIEvent *ev = nil;
            SEL se = NSSelectorFromString(@"_touchesEvent");
            if ([UIApplication.sharedApplication respondsToSelector:se]) {
          #pragma clang diagnostic push
          #pragma clang diagnostic ignored "-Warc-performSelector-leaks"
              ev = [UIApplication.sharedApplication performSelector:se];
              SEL sc = NSSelectorFromString(@"_clearTouches");
              if ([ev respondsToSelector:sc]) [ev performSelector:sc];
          #pragma clang diagnostic pop
              SEL sa = NSSelectorFromString(@"_addTouch:forDelayedDelivery:");
              if ([ev respondsToSelector:sa]) {
                for (UITouch *t in touches) {
                  NSInvocation *inv = [NSInvocation invocationWithMethodSignature:[ev methodSignatureForSelector:sa]];
                  inv.target = ev; inv.selector = sa;
                  UITouch *tt = t; BOOL d = NO;
                  [inv setArgument:&tt atIndex:2]; [inv setArgument:&d atIndex:3];
                  [inv invoke];
                }
              }
            }
            return ev;
          }

          // began ou ended pour les 3 carres a la fois (multi-touch), groupes par vue cible
          static void bysgBoostSend(UITouchPhase ph, int only) {
            UIWindow *w = keyWin();
            UIView *gv = w.rootViewController.view;
            if (!w || !gv) return;
            NSMutableDictionary<NSValue *, NSMutableArray *> *groups = [NSMutableDictionary dictionary];
            NSMutableDictionary<NSValue *, UIView *> *views = [NSMutableDictionary dictionary];
            for (int i = 0; i < 3; i++) {
              if (only >= 0 && i != only) continue;
              CGPoint pw = bysgBoostPoint(i, w);
              UIView *target = [gv hitTest:[gv convertPoint:pw fromView:w] withEvent:nil] ?: gv;
              if (ph == UITouchPhaseBegan || !boostTouch[i]) boostTouch[i] = bysgNewTouch();   // touche neuve a chaque appui : aucun etat residuel d'une partie a l'autre
              UITouch *t = boostTouch[i];
              if (!t) continue;
              bysgConfigTouch(t, w, target, pw, ph, ph == UITouchPhaseBegan);
              NSValue *key = [NSValue valueWithNonretainedObject:target];
              if (!groups[key]) { groups[key] = [NSMutableArray array]; views[key] = target; }
              [groups[key] addObject:t];
            }
            for (NSValue *key in groups) {
              NSSet *set = [NSSet setWithArray:groups[key]];
              UIView *target = views[key];
              UIEvent *ev = bysgTouchesEvent(set);
              @try {
                if (ph == UITouchPhaseBegan) [target touchesBegan:set withEvent:ev];
                else [target touchesEnded:set withEvent:ev];
              } @catch (__unused id e) {}
            }
          }

          // ---------- Macro : glissements automatiques (gauche / droite / haut / bas) ----------
          // Touches virtuelles envoyees directement a la vue du jeu, comme l'Auto Boost. Un glissement = 3 images
          // (appui, deplacement, relache) sur un CADisplayLink a la frequence maximale de l'ecran : aucun delai ajoute.
          static BOOL gMcOn = NO;
          static int gMcDirs = 3, gMcMode = 0, gMcSpd = 3, gMcDist = 140;   // dirs : 1 gauche, 2 droite, 4 haut, 8 bas / mode : 0 alterne, 1 aleatoire, 2 simultane
          static CADisplayLink *mcLink;
          static int mcPhase = 0, mcWait = 0, mcSeq = 0, mcN = 0;
          static CGPoint mcA[4], mcB[4];
          static UITouch *mcT[4];
          static int gMcSeq[2000], gMcSeqN = 0;              // sequence de mouvements (vide = anciennes directions)

          static void bysgMcPlan(void) {
            static const int bit[4] = {1, 2, 4, 8};
            int list[16], nl = 0;
            if (gMcSeqN > 0) { for (int i = 0; i < gMcSeqN; i++) list[nl++] = gMcSeq[i]; }
            else { for (int i = 0; i < 4; i++) if (gMcDirs & bit[i]) list[nl++] = i; }
            if (!nl) { list[nl++] = 0; list[nl++] = 1; }
            UIWindow *w = keyWin();
            CGSize sb = w ? w.bounds.size : CGSizeMake(390, 844);
            CGFloat half = MIN((CGFloat)gMcDist, MIN(sb.width, sb.height) * 0.8) * 0.5;
            CGPoint c = CGPointMake(sb.width * 0.5, sb.height * 0.58);
            int dirs[4], n = 0;
            if (gMcMode == 2) { for (int i = 0; i < nl && n < 4; i++) dirs[n++] = list[i]; }
            else if (gMcMode == 1) dirs[n++] = list[arc4random_uniform((uint32_t)nl)];
            else dirs[n++] = list[(mcSeq++) % nl];
            mcN = n;
            for (int i = 0; i < n; i++) {
              CGFloat ox = (gMcMode == 2) ? (i - (n - 1) / 2.0) * 36.0 : 0;    // doigts simultanes : legerement decales
              CGFloat dx = 0, dy = 0;
              switch (dirs[i]) { case 0: dx = -1; break; case 1: dx = 1; break; case 2: dy = -1; break; default: dy = 1; break; }
              mcA[i] = CGPointMake(c.x + ox - dx * half, c.y - dy * half);
              mcB[i] = CGPointMake(c.x + ox + dx * half, c.y + dy * half);
            }
          }

          static void bysgMcSend(UITouchPhase ph) {
            UIWindow *w = keyWin();
            UIView *gv = w.rootViewController.view;
            if (!w || !gv) return;
            NSMutableDictionary<NSValue *, NSMutableArray *> *groups = [NSMutableDictionary dictionary];
            NSMutableDictionary<NSValue *, UIView *> *views = [NSMutableDictionary dictionary];
            for (int i = 0; i < mcN; i++) {
              CGPoint pw = (ph == UITouchPhaseBegan) ? mcA[i] : mcB[i];
              UIView *target = [gv hitTest:[gv convertPoint:mcA[i] fromView:w] withEvent:nil] ?: gv;
              if (ph == UITouchPhaseBegan || !mcT[i]) mcT[i] = bysgNewTouch();    // touche neuve a chaque glissement
              UITouch *t = mcT[i];
              if (!t) continue;
              bysgConfigTouch(t, w, target, pw, ph, ph == UITouchPhaseBegan);
              NSValue *key = [NSValue valueWithNonretainedObject:target];
              if (!groups[key]) { groups[key] = [NSMutableArray array]; views[key] = target; }
              [groups[key] addObject:t];
            }
            for (NSValue *key in groups) {
              NSSet *set = [NSSet setWithArray:groups[key]];
              UIView *target = views[key];
              UIEvent *ev = bysgTouchesEvent(set);
              @try {
                if (ph == UITouchPhaseBegan) [target touchesBegan:set withEvent:ev];
                else if (ph == UITouchPhaseMoved) [target touchesMoved:set withEvent:ev];
                else [target touchesEnded:set withEvent:ev];
              } @catch (__unused id e) {}
            }
          }

          @interface BYSGMcCtl : NSObject
          + (instancetype)shared; - (void)frame:(CADisplayLink *)l;
          @end
          @implementation BYSGMcCtl
          + (instancetype)shared { static BYSGMcCtl *s; static dispatch_once_t o; dispatch_once(&o, ^{ s = [BYSGMcCtl new]; }); return s; }
          - (void)frame:(CADisplayLink *)l {
            if (!gMcOn) return;
            if (mcWait > 0) { mcWait--; return; }
            if (mcPhase == 0) { bysgMcPlan(); bysgMcSend(UITouchPhaseBegan); mcPhase = 1; }
            else if (mcPhase == 1) { bysgMcSend(UITouchPhaseMoved); if (gMcSpd >= 3) { bysgMcSend(UITouchPhaseEnded); mcPhase = 0; mcWait = 0; } else mcPhase = 2; }
            else { bysgMcSend(UITouchPhaseEnded); mcPhase = 0; mcWait = (gMcSpd == 2) ? 1 : 3; }
          }
          @end

          static void bysgMcConfig(BOOL on, int dirs, int mode, int spd, int dist, NSArray *seq) {
            gMcSeqN = 0;
            for (id q in seq) { if (gMcSeqN >= 2000) break; int v = [q intValue]; gMcSeq[gMcSeqN++] = v < 0 ? 0 : (v > 3 ? 3 : v); }
            gMcDirs = dirs & 15; gMcMode = mode < 0 ? 0 : (mode > 2 ? 2 : mode);
            gMcSpd = spd < 1 ? 1 : (spd > 3 ? 3 : spd);
            gMcDist = dist < 60 ? 60 : (dist > 320 ? 320 : dist);
            if (!mcLink) {
              mcLink = [CADisplayLink displayLinkWithTarget:[BYSGMcCtl shared] selector:@selector(frame:)];
              mcLink.preferredFramesPerSecond = UIScreen.mainScreen.maximumFramesPerSecond;
              [mcLink addToRunLoop:NSRunLoop.mainRunLoop forMode:NSRunLoopCommonModes];
              mcLink.paused = YES;
            }
            if (on == gMcOn) return;
            if (!on && mcPhase != 0) { bysgMcSend(UITouchPhaseEnded); mcPhase = 0; }   // pas de doigt reste coince
            gMcOn = on; mcPhase = 0; mcWait = 0;
            mcLink.paused = !on;
          }

          // ---------- Clavier : fleches + Z Q S D -> glissements (multi-touch) ----------
          // Chaque direction a son propre doigt virtuel (UITouch distinct, avec son propre pathIndex / touchIdentifier), ses propres
          // coordonnees de depart et d'arrivee, et son propre etat. Tous les doigts d'un meme evenement sont livres a UNE SEULE vue
          // cible, et chaque evenement contient la liste complete des doigts actifs (comme le fait UIKit avec de vrais doigts).
          // Mode Simultane : les touches pressees presque ensemble (fenetre d'accord) se posent et glissent dans le meme evenement.
          // Mode Enchaine : un doigt a la fois, image apres image (pour les jeux qui ne lisent qu'un seul doigt).
          static BOOL gKbOn = NO, gKbFast = YES;
          static int gKbDist = 200;
          static CGPoint kbA[4], kbB[4];
          static UITouch *kbT[4];
          static unsigned kbUid[4], kbUidSeq = 0;
          static UIView *kbView = nil;                       // vue cible commune a tous les doigts actifs
          static CADisplayLink *kbLink;
          static BOOL kbReg = NO;
          static double kbLogT0 = 0, kbLogLast = -1e9;
          static void bysgKbEmit(int mask, int ph);
          static void bysgKbGeom(int d);
          static void bysgKbWake(void);
          static void bysgKbSchedFlush(void);
          static void bysgKbNotify(void);
          static void bysgKbLogf(const char *fmt, ...) __attribute__((format(printf, 1, 2)));

          // ===== KBCORE-BEGIN : logique pure des doigts virtuels (compilee aussi hors iOS pour les tests) =====
          // 4 doigts virtuels, un par direction : 0 GAUCHE, 1 DROITE, 2 HAUT, 3 BAS.
          // kbPh : 0 libre, 1 doigt pose (Began envoye, Moved en attente), 2 doigt au bout (Moved envoye).
          enum { KB_BEGAN = 0, KB_MOVED = 1, KB_ENDED = 3 };
          static int kbHeld[4], kbPh[4], kbRe[4];
          static int kbPend = 0;
          static BOOL kbFlushQ = NO;
          static int kbOrd[8], kbOrdN = 0;
          static int kbWaitQ[8], kbWaitN = 0;
          static double kbDownT[4];                           // instant (ms) de l'appui de chaque direction
          static double kbLastKeyT = -1e9;
          static const char *kbNm[4] = { "GAUCHE", "DROITE", "HAUT", "BAS" };

          static void bysgKbMaskStr(int m, char *o) {
            o[0] = 0; int n = 0;
            for (int d = 0; d < 4; d++) if (m & (1 << d)) { if (n++) strcat(o, "+"); strcat(o, kbNm[d]); }
            if (!n) strcpy(o, "-");
          }
          static int kbHeldMask(void) { int m = 0; for (int d = 0; d < 4; d++) if (kbHeld[d] > 0) m |= 1 << d; return m; }

          static void bysgKbQueue(int d, double now) {
            kbPend |= 1 << d; if (kbOrdN < 8) kbOrd[kbOrdN++] = d; kbDownT[d] = now;
            if (!kbFlushQ) { kbFlushQ = YES; bysgKbSchedFlush(); }
          }
          static void bysgKbWaitAdd(int d) {
            for (int i = 0; i < kbWaitN; i++) if (kbWaitQ[i] == d) return;
            if (kbWaitN < 8) kbWaitQ[kbWaitN++] = d;
          }
          static void bysgKbStartNext(double now) {            // mode Enchaine uniquement
            if (kbPh[0] || kbPh[1] || kbPh[2] || kbPh[3] || kbWaitN == 0) return;
            int d = kbWaitQ[0];
            for (int i = 1; i < kbWaitN; i++) kbWaitQ[i - 1] = kbWaitQ[i];
            kbWaitN--;
            bysgKbGeom(d); kbPh[d] = 1; kbDownT[d] = now;
            bysgKbEmit(1 << d, KB_BEGAN);
            bysgKbWake();
          }
          static void bysgKbFlush(double now) {
            kbFlushQ = NO;
            if (!gKbSim) {                                     // ENCHAINE : un doigt a la fois, image apres image
              for (int i = 0; i < kbOrdN; i++) { int d = kbOrd[i]; if ((kbPend >> d) & 1) bysgKbWaitAdd(d); }
              kbPend = 0; kbOrdN = 0;
              bysgKbStartNext(now);
              bysgKbWake();
              return;
            }
            int mask = 0;                                      // SIMULTANE : tous les doigts en attente se posent dans le MEME evenement
            for (int i = 0; i < kbOrdN; i++) {
              int d = kbOrd[i];
              if (((kbPend >> d) & 1) && kbPh[d] == 0 && !((mask >> d) & 1)) { bysgKbGeom(d); kbPh[d] = 1; mask |= 1 << d; }
            }
            kbPend = 0; kbOrdN = 0; kbWaitN = 0;
            if (mask) bysgKbEmit(mask, KB_BEGAN);
            bysgKbWake();
          }
          static void bysgKbEndNow(int d) {
            bysgKbEmit(1 << d, KB_ENDED);
            kbPh[d] = 0;
          }
          static void bysgKbKeyDown(int d, double now) {
            if (kbHeld[d]++ != 0) return;                      // deja enfoncee (autre touche de la meme direction)
            { char hs[64]; bysgKbMaskStr(kbHeldMask(), hs);
              bysgKbLogf("TOUCHE %s ENFONCEE  tenues=%s  ecart=%.0fms", kbNm[d], hs, kbLastKeyT < -1e8 ? 0.0 : now - kbLastKeyT); }
            kbLastKeyT = now;
            bysgKbNotify();
            if (kbPh[d] == 0) bysgKbQueue(d, now);             // doigt libre : il se pose tout de suite
            else if (kbPh[d] == 2) { bysgKbEndNow(d); bysgKbQueue(d, now); }   // doigt deja au bout : on le leve et on repart
            else kbRe[d] = 1;                                  // doigt qui vient de se poser : on enchaine juste apres
            bysgKbWake();
          }
          static void bysgKbKeyUp(int d, double now) {
            if (kbHeld[d] > 0 && --kbHeld[d] == 0) {
              bysgKbLogf("TOUCHE %s RELACHEE", kbNm[d]);
              bysgKbNotify();
              if (kbPh[d] == 2) {                              // relache pendant le maintien : on leve tout de suite
                bysgKbEndNow(d);
                if (kbRe[d]) { kbRe[d] = 0; bysgKbQueue(d, now); }
              }
            }
          }
          // Une image d'ecran. Renvoie 1 quand plus rien n'est en cours (le CADisplayLink peut se mettre en pause).
          static int bysgKbStep(double now) {
            int ph1 = 0; double oldest = 1e18;
            for (int d = 0; d < 4; d++) if (kbPh[d] == 1) { ph1 |= 1 << d; if (kbDownT[d] < oldest) oldest = kbDownT[d]; }
            int mv = ph1;
            // fenetre d'accord : on attend un court instant apres le PREMIER appui pour que les touches presque simultanees glissent ensemble
            if (ph1 && gKbSim && gKbChordMs > 0 && now - oldest < gKbChordMs) mv = 0;
            if (mv) {                                          // tous les doigts poses glissent ensemble, dans un seul evenement
              bysgKbEmit(mv, KB_MOVED);
              for (int d = 0; d < 4; d++) if (mv & (1 << d)) kbPh[d] = 2;
            }
            int en = 0;
            for (int d = 0; d < 4; d++) {
              if (kbPh[d] != 2) continue;
              int fresh = (mv >> d) & 1;
              int seqBusy = !gKbSim && (kbWaitN > 0 || kbPend);   // seul le mode Enchaine fait attendre les autres doigts
              if (kbRe[d] || seqBusy || (kbHeld[d] == 0 && (gKbFast || !fresh))) en |= 1 << d;   // instantane : relache dans la meme image
            }
            if (en) {
              bysgKbEmit(en, KB_ENDED);
              for (int d = 0; d < 4; d++) if (en & (1 << d)) {
                kbPh[d] = 0;
                if (kbRe[d]) { kbRe[d] = 0; kbPend |= 1 << d; if (kbOrdN < 8) kbOrd[kbOrdN++] = d; kbDownT[d] = now; }
              }
            }
            if (kbPend) bysgKbFlush(now); else bysgKbStartNext(now);
            return !kbPend && !kbWaitN && !kbPh[0] && !kbPh[1] && !kbPh[2] && !kbPh[3];
          }
          // ===== KBCORE-END =====

          static double bysgKbNowMs(void) { return CACurrentMediaTime() * 1000.0; }
          static void bysgKbSchedFlush(void) { dispatch_async(dispatch_get_main_queue(), ^{ bysgKbFlush(bysgKbNowMs()); }); }
          static void bysgKbWake(void) { if (kbLink) kbLink.paused = NO; }

          // Envoie a l'overlay les touches REELLEMENT maintenues (bit 0 gauche, 1 droite, 2 haut, 3 bas) des qu'elles changent
          static void bysgKbNotify(void) {
            int mk = kbHeldMask();
            if (mk == gKbMaskSent) return;
            gKbMaskSent = mk;
            WKWebView *wv = gKbWeb;
            if (wv) [wv evaluateJavaScript:[NSString stringWithFormat:@"window.kbk&&kbk(%d)", mk] completionHandler:nil];
          }

          // Journal : NSLog (console) + petite boite a l'ecran (reglage "Journal des doigts")
          static void bysgKbLogf(const char *fmt, ...) {
            if (!gKbLogOn) return;
            char buf[240];
            va_list ap; va_start(ap, fmt); vsnprintf(buf, sizeof buf, fmt, ap); va_end(ap);
            double now = bysgKbNowMs();
            if (now - kbLogLast > 1500) kbLogT0 = now;
            kbLogLast = now;
            NSString *body = [NSString stringWithUTF8String:buf] ?: @"";
            NSString *s = [NSString stringWithFormat:@"+%4.0f %@", now - kbLogT0, body];
            NSLog(@"[BYSG-KB] %@", s);
            WKWebView *wv = gKbWeb;
            if (!wv) return;
            NSData *jd = [NSJSONSerialization dataWithJSONObject:@[s] options:0 error:nil];
            NSString *arr = jd ? [[NSString alloc] initWithData:jd encoding:NSUTF8StringEncoding] : nil;
            if (arr) [wv evaluateJavaScript:[NSString stringWithFormat:@"window.kbl&&kbl((%@)[0])", arr] completionHandler:nil];
          }

          static void bysgKbGeom(int d) {
            UIWindow *w = keyWin();
            CGSize sb = w ? w.bounds.size : CGSizeMake(390, 844);
            CGFloat half = MIN((CGFloat)gKbDist, MIN(sb.width, sb.height) * 0.8) * 0.5;
            CGFloat ox = (d - 1.5) * 34.0;                   // doigts simultanes : legerement decales (coordonnees propres a chaque doigt)
            CGPoint c = CGPointMake(sb.width * 0.5 + ox, sb.height * 0.58);
            CGFloat dx = 0, dy = 0;
            switch (d) { case 0: dx = -1; break; case 1: dx = 1; break; case 2: dy = -1; break; default: dy = 1; break; }
            kbA[d] = CGPointMake(c.x - dx * half, c.y - dy * half);
            kbB[d] = CGPointMake(c.x + dx * half, c.y + dy * half);
          }

          // identite propre a chaque doigt virtuel (un vrai doigt a un pathIndex et un touchIdentifier uniques)
          static void bysgKbSetIdentity(UITouch *t, int d, unsigned uid) {
            bysgSetIvarObj(t, @"pathIndex", @(d + 1));
            bysgSetIvarObj(t, @"pathIdentity", @(d + 1));
            bysgSetIvarObj(t, @"touchIdentifier", @(uid));
          }
          static void bysgKbIdStr(UITouch *t, char *o, size_t n) {
            id pi = nil, ti = nil;
            @try { pi = [t valueForKey:@"pathIndex"]; } @catch (__unused id e) {}
            @try { ti = [t valueForKey:@"touchIdentifier"]; } @catch (__unused id e) {}
            snprintf(o, n, "idx=%s uid=%s", pi ? [[pi description] UTF8String] : "?", ti ? [[ti description] UTF8String] : "?");
          }

          // Envoie une phase pour toutes les directions du masque en UN SEUL evenement multi-touch, vers UNE SEULE vue.
          // L'evenement contient tous les doigts actifs ; "touches" ne contient que ceux qui changent (comme UIKit).
          static void bysgKbEmit(int mask, int ph) {
            UIWindow *w = keyWin();
            UIView *gv = w.rootViewController.view;
            if (!w || !gv || !mask) return;
            BOOL any = NO;                                   // un autre doigt est deja pose ?
            for (int d = 0; d < 4; d++) if (kbT[d] && !((mask >> d) & 1)) any = YES;
            if (ph == KB_BEGAN && (!any || !kbView)) {
              int d0 = 0; while (d0 < 3 && !((mask >> d0) & 1)) d0++;
              kbView = [gv hitTest:[gv convertPoint:kbA[d0] fromView:w] withEvent:nil] ?: gv;
            }
            UIView *target = kbView ?: gv;
            NSMutableSet *sub = [NSMutableSet set];
            BOOL firstDone = any;
            for (int d = 0; d < 4; d++) {
              if (!(mask & (1 << d))) continue;
              CGPoint pw = (ph == KB_BEGAN) ? kbA[d] : kbB[d];
              if (ph == KB_BEGAN || !kbT[d]) { kbT[d] = bysgNewTouch(); kbUid[d] = ++kbUidSeq; }
              UITouch *t = kbT[d];
              if (!t) continue;
              BOOL first = (ph == KB_BEGAN) && !firstDone;   // seul le premier doigt de la vue est "first touch", comme UIKit
              if (ph == KB_BEGAN) firstDone = YES;
              bysgConfigTouch(t, w, target, pw, (UITouchPhase)ph, first);
              if (ph == KB_BEGAN) bysgKbSetIdentity(t, d, kbUid[d]);
              [sub addObject:t];
            }
            NSMutableSet *all = [NSMutableSet set];          // tous les doigts actifs (ceux qui ne bougent pas sont "stationary")
            for (int d = 0; d < 4; d++) {
              if (!kbT[d]) continue;
              if (!((mask >> d) & 1)) bysgSetIvarObj(kbT[d], @"phase", @(UITouchPhaseStationary));
              [all addObject:kbT[d]];
            }
            if (!sub.count) return;
            UIEvent *ev = bysgTouchesEvent(all);
            @try {
              if (ph == KB_BEGAN) [target touchesBegan:sub withEvent:ev];
              else if (ph == KB_MOVED) [target touchesMoved:sub withEvent:ev];
              else [target touchesEnded:sub withEvent:ev];
            } @catch (__unused id e) {}
            if (gKbLogOn) {
              char ms[64]; bysgKbMaskStr(mask, ms);
              bysgKbLogf("%s %s : %lu doigt(s) dans 1 evenement, %lu actif(s), vue=%s", ph == KB_BEGAN ? "BEGAN" : ph == KB_MOVED ? "MOVED" : "ENDED",
                         ms, (unsigned long)sub.count, (unsigned long)all.count, [NSStringFromClass([target class]) UTF8String]);
              for (int d = 0; d < 4; d++) if ((mask >> d) & 1 && kbT[d]) {
                char ids[80]; bysgKbIdStr(kbT[d], ids, sizeof ids);
                bysgKbLogf("   %s %s (%.0f,%.0f)->(%.0f,%.0f)", kbNm[d], ids, kbA[d].x, kbA[d].y, kbB[d].x, kbB[d].y);
              }
            }
            if (ph == KB_ENDED) {
              BOOL left = NO;
              for (int d = 0; d < 4; d++) { if ((mask >> d) & 1) kbT[d] = nil; if (kbT[d]) left = YES; }
              if (!left) kbView = nil;
            }
          }

          // Codes physiques : sur AZERTY, Z Q S D sont aux positions W A S D (on accepte aussi Z et Q au cas ou le code suit la lettre)
          static int bysgKbDir(GCKeyCode k) {
            if (k == GCKeyCodeLeftArrow  || k == GCKeyCodeKeyA || k == GCKeyCodeKeyQ) return 0;
            if (k == GCKeyCodeRightArrow || k == GCKeyCodeKeyD) return 1;
            if (k == GCKeyCodeUpArrow    || k == GCKeyCodeKeyW || k == GCKeyCodeKeyZ) return 2;
            if (k == GCKeyCodeDownArrow  || k == GCKeyCodeKeyS) return 3;
            return -1;
          }

          static void bysgKbReset(void) {
            int m = 0;
            for (int d = 0; d < 4; d++) if (kbPh[d]) m |= 1 << d;
            if (m) bysgKbEmit(m, KB_ENDED);                  // pas de doigt reste coince
            for (int d = 0; d < 4; d++) { kbPh[d] = 0; kbT[d] = nil; kbHeld[d] = 0; kbRe[d] = 0; }
            kbWaitN = 0; kbOrdN = 0; kbPend = 0; kbFlushQ = NO; kbView = nil;
            bysgKbNotify();
          }

          static void bysgKbAttach(void) {
            GCKeyboard *kb = GCKeyboard.coalescedKeyboard;
            if (!kb) return;
            kb.keyboardInput.keyChangedHandler = ^(GCKeyboardInput *input, GCControllerButtonInput *key, GCKeyCode code, BOOL pressed) {
              int d = bysgKbDir(code);
              if (d < 0 || !gKbOn) return;
              double now = bysgKbNowMs();
              if (pressed) bysgKbKeyDown(d, now); else bysgKbKeyUp(d, now);
            };
          }

          @interface BYSGKbCtl : NSObject
          + (instancetype)shared; - (void)frame:(CADisplayLink *)l;
          @end
          @implementation BYSGKbCtl
          + (instancetype)shared { static BYSGKbCtl *s; static dispatch_once_t o; dispatch_once(&o, ^{ s = [BYSGKbCtl new]; }); return s; }
          - (void)frame:(CADisplayLink *)l {
            if (!gKbOn) { l.paused = YES; return; }
            if (bysgKbStep(bysgKbNowMs())) l.paused = YES;   // plus aucun doigt en cours : on dort
          }
          @end

          static void bysgKbConfig(BOOL on, int dist, int mode) {
            gKbFast = mode != 0;
            gKbDist = dist < 60 ? 60 : (dist > 320 ? 320 : dist);
            if (!kbLink) {
              kbLink = [CADisplayLink displayLinkWithTarget:[BYSGKbCtl shared] selector:@selector(frame:)];
              kbLink.preferredFramesPerSecond = UIScreen.mainScreen.maximumFramesPerSecond;
              [kbLink addToRunLoop:NSRunLoop.mainRunLoop forMode:NSRunLoopCommonModes];
              kbLink.paused = YES;
            }
            if (!kbReg) {
              kbReg = YES;
              NSNotificationCenter *nc = NSNotificationCenter.defaultCenter;
              [nc addObserverForName:GCKeyboardDidConnectNotification object:nil queue:NSOperationQueue.mainQueue usingBlock:^(NSNotification *n) { if (gKbOn) bysgKbAttach(); }];
              [nc addObserverForName:GCKeyboardDidDisconnectNotification object:nil queue:NSOperationQueue.mainQueue usingBlock:^(NSNotification *n) { bysgKbReset(); }];
              [nc addObserverForName:UIApplicationWillResignActiveNotification object:nil queue:NSOperationQueue.mainQueue usingBlock:^(NSNotification *n) { bysgKbReset(); }];
            }
            if (on == gKbOn) return;
            if (!on) {
              bysgKbReset();
              GCKeyboard *kb = GCKeyboard.coalescedKeyboard;
              if (kb) kb.keyboardInput.keyChangedHandler = nil;
            }
            gKbOn = on;
            if (on) bysgKbAttach();
          }

          // Rafale : au depart de la partie, on appuie une fois sur chaque boost (3 passes pour etre sur), puis c'est fini.
          static void bysgBoostBurstAt(CFTimeInterval base, int delayMs) {
            for (int i = 0; i < 3; i++) if (boostDown[i] && !gBoostEdit) { bysgBoostSend(UITouchPhaseEnded, i); boostDown[i] = NO; }   // pas de doigt reste coince
            boostNSteps = 0; boostPos = 0;
            double hold = kHold[gBoostSpd], gap = kGap[gBoostSpd];
            CFTimeInterval nowT = CACurrentMediaTime();
            CFTimeInterval t = MAX(base + delayMs / 1000.0, nowT);   // le delai se compte depuis le son, pas depuis l'arrivee sur le thread principal
            for (int p = 0; p < 3; p++) {
              for (int i = 0; i < gABN && i < 3; i++) {
                if (boostNSteps + 2 > 96) break;
                boostSteps[boostNSteps++] = (BoostStep){t, i, 0};
                boostSteps[boostNSteps++] = (BoostStep){t + hold, i, 1};
                t += hold + gap;
              }
              t += 0.03;
            }
            gStopGuardUntil = t + 1.2;                       // les sons des boosts ne doivent pas arreter le chrono
          }
          static void bysgBoostBurst(int delayMs) { bysgBoostBurstAt(CACurrentMediaTime(), delayMs); }

          static void bysgBoostTick(CADisplayLink *l) {
            if (boostPos >= boostNSteps) return;
            CFTimeInterval now = CACurrentMediaTime();
            while (boostPos < boostNSteps && boostSteps[boostPos].t <= now + 0.002) {
              BoostStep st = boostSteps[boostPos++];
              if (gBoostEdit) continue;
              bysgBoostSend(st.ph == 0 ? UITouchPhaseBegan : UITouchPhaseEnded, st.idx);
              boostDown[st.idx] = (st.ph == 0);
            }
          }

          // appelee au son de depart : declenche la rafale (si l'Auto Boost est active)
          static void bysgBoostSetRun(BOOL r, CFTimeInterval tDet) { if (r && gABEnabled && !gBoostEdit) bysgBoostBurstAt(tDet, gABDelay); }
          static void bysgBoostRefresh(void) {
            for (int i = 0; i < 3; i++) boostSq[i].hidden = !(gBoostEdit && i < gABN);
            boostBar.hidden = !gBoostEdit;
          }

          // ---------- Auto Quit : a la mort, appuie tout seul sur les carres 1, 2, 3 (a placer sur les boutons du jeu) pour quitter la partie ----------
          // Meme principe que l'Auto Boost : touches virtuelles envoyees directement a la vue du jeu, mais UN carre apres l'autre (avec une pause).
          static BOOL gAQEnabled = NO, gAQEdit = NO;
          static int gAQN = 3, gAQDelay = 600, gAQGap = 450;      // nombre de carres, delai apres la mort (ms), pause entre deux appuis (ms)
          static UIView *aqBar;
          static UIButton *aqBtn;
          static UIView *aqSq[3];
          static UITouch *aqTouch[3];
          static BOOL aqDown[3];
          typedef struct { CFTimeInterval t; int idx; int ph; } AQStep;
          static AQStep aqSteps[8];
          static int aqNSteps = 0, aqPos = 0;
          static CFTimeInterval gAQBusyUntil = 0;

          static CGPoint bysgAQPoint(int i, UIWindow *w) {
            UIView *s = aqSq[i];
            return s ? s.center : CGPointMake(w.bounds.size.width * 0.50, w.bounds.size.height * (0.30 + 0.12 * i));
          }

          static void bysgAQSend(UITouchPhase ph, int i) {
            UIWindow *w = keyWin();
            UIView *gv = w.rootViewController.view;
            if (!w || !gv || i < 0 || i > 2) return;
            CGPoint pw = bysgAQPoint(i, w);
            UIView *target = [gv hitTest:[gv convertPoint:pw fromView:w] withEvent:nil] ?: gv;
            if (ph == UITouchPhaseBegan || !aqTouch[i]) aqTouch[i] = bysgNewTouch();    // touche neuve a chaque appui
            UITouch *t = aqTouch[i];
            if (!t) return;
            bysgConfigTouch(t, w, target, pw, ph, ph == UITouchPhaseBegan);
            NSSet *set = [NSSet setWithObject:t];
            UIEvent *ev = bysgTouchesEvent(set);
            @try {
              if (ph == UITouchPhaseBegan) [target touchesBegan:set withEvent:ev];
              else [target touchesEnded:set withEvent:ev];
            } @catch (__unused id e) {}
          }

          static void bysgAQRunAt(CFTimeInterval base, int delayMs) {
            for (int i = 0; i < 3; i++) if (aqDown[i]) { bysgAQSend(UITouchPhaseEnded, i); aqDown[i] = NO; }   // pas de doigt reste coince
            aqNSteps = 0; aqPos = 0;
            CFTimeInterval t = MAX(base + delayMs / 1000.0, CACurrentMediaTime());
            for (int i = 0; i < gAQN && i < 3; i++) {
              aqSteps[aqNSteps++] = (AQStep){t, i, 0};
              aqSteps[aqNSteps++] = (AQStep){t + 0.06, i, 1};
              t += gAQGap / 1000.0;
            }
            gAQBusyUntil = t + 1.0;                          // pas de second declenchement pendant la sequence
          }

          static void bysgAQTick(void) {
            if (aqPos >= aqNSteps) return;
            CFTimeInterval now = CACurrentMediaTime();
            while (aqPos < aqNSteps && aqSteps[aqPos].t <= now + 0.002) {
              AQStep st = aqSteps[aqPos++];
              if (gAQEdit) continue;
              bysgAQSend(st.ph == 0 ? UITouchPhaseBegan : UITouchPhaseEnded, st.idx);
              aqDown[st.idx] = (st.ph == 0);
            }
          }

          static void bysgAQTrigger(CFTimeInterval tDet) {
            if (gAQEnabled && !gAQEdit && !gBoostEdit && CACurrentMediaTime() > gAQBusyUntil) bysgAQRunAt(tDet, gAQDelay);
          }

          static void bysgAQRefresh(void) {
            for (int i = 0; i < 3; i++) aqSq[i].hidden = !(gAQEdit && i < gAQN);
            aqBar.hidden = !gAQEdit;
          }

