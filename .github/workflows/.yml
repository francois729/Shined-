      - name: Ecrire BYSG.m
        run: |
          cat > BYSG.m <<'BYSG_M_END'
          // BYSG overlay : WKWebView transparent qui ne capte les touches QUE sur le timer
          #import <UIKit/UIKit.h>
          #import <WebKit/WebKit.h>
          #import <PhotosUI/PhotosUI.h>
          #import <AVFoundation/AVFoundation.h>
          #import <objc/runtime.h>
          #include <mach/mach_time.h>
          #include <time.h>
          #include <fcntl.h>
          #include <sys/stat.h>
          #include <stdarg.h>
          #include <unistd.h>
          #include "fishhook.h"
          #include "chrono_html.h"
          #include "LuckySpeederWrap.h"
          #include <AudioToolbox/AudioToolbox.h>
          #include "bysg_det.h"
          #import <QuartzCore/QuartzCore.h>
          #import <GameController/GameController.h>
          #import <objc/runtime.h>

          static BOOL gStretch = NO, gGray = NO;
          static int gKbChordMs = 30;          // fenetre d'accord (ms) : les touches pressees dans ce delai glissent ensemble (mode Simultane)
          static BOOL gKbLogOn = NO;           // journal des doigts virtuels
          static int gKbSim = 0;               // 0 : les mouvements s'enchainent image par image (le jeu lit un glissement a la fois) ; 1 : doigts simultanes
          static int gAA = 1;                // Anti-aliasing par suréchantillonnage : 1, 2 ou 4
          static int gQual = 2;               // Graphics Quality : 0 Low, 1 Mid, 2 High
          static CGFloat gSat = 1.0, gSatB = 1.0;
          static CGFloat gPct = 1.0, gRW = 1440, gRH = 1080;
          static UIView *grayView;
          static BOOL gGmOn = NO;            // Pack graphique : matrice de couleurs envoyee par l'interface
          static float gGm[20];
          static int gGmVer = 0;
          static NSDictionary *bysgMapInfo(NSString *sel);   // defini plus bas
          static NSString *bysgMapDir(NSString *name);       // defini plus bas
          static void bysgRestartSoon(void);                 // defini plus bas

          // ---------- Vitesse du jeu (speed hack LuckySpeeder, licence MIT) ----------
          // 5 méthodes : 0 Unity timeScale, 1 gettimeofday, 2 clock_gettime, 3 mach_absolute_time, 4 SpriteKit
          static int gMode = 3;
          static double gSpd = 1.0;
          static BOOL gHooked = NO;
          static void bysgApplySpeed(WKWebView *web) {
            if (gHooked && (int)currentMod != gMode) { resetHook(); gHooked = NO; }
            if (!gHooked && gSpd == 1.0) return;
            currentMod = (enum SpeedMode)gMode;
            if (!gHooked) {
              BOOL ok = (initHook() == HOOK_SUCCESS);
              [web evaluateJavaScript:[NSString stringWithFormat:@"window.spf&&spf(%d)", ok ? 1 : 0] completionHandler:nil];
              if (!ok) return;
              gHooked = YES;
            }
            updateSpeed((float)gSpd);
          }

          // ---------- Résolution étirée ----------
          // Façon PC : on choisit une résolution (ex. 1440x1080), elle est adaptée aux pixels réels du téléphone
          // (jamais plus grande que l'écran, orientation respectée), le jeu est rendu dans cette résolution puis étiré plein écran.
          // Le curseur va de 0 % (écran normal) à 100 % (résolution choisie).
          static void bysgStretch(UIWindow *w) {
            UIView *gv = w.rootViewController.view;
            if (!gv) return;
            CGSize sb = w.bounds.size;
            CGFloat sc = UIScreen.mainScreen.nativeScale, tw = sb.width, th = sb.height;
            if (gStretch && gPct >= 0.01) {
              CGFloat spw = sb.width * sc, sph = sb.height * sc;
              CGFloat lg = MAX(gRW, gRH), sh = MIN(gRW, gRH);
              CGFloat k = MIN(1.0, MIN(MAX(spw, sph) / lg, MIN(spw, sph) / sh));
              BOOL land = sb.width > sb.height;
              CGFloat rw = (land ? lg : sh) * k, rh = (land ? sh : lg) * k;
              tw = (spw + (rw - spw) * gPct) / sc;
              th = (sph + (rh - sph) * gPct) / sc;
            }
            if (gQual == 3) { tw = floor(tw * 1.25); th = floor(th * 1.25); }   // Ultra : rendu 1,25 fois plus grand puis réduit
            if (gAA > 1) { CGFloat af = sqrt((double)gAA); tw = floor(tw * af); th = floor(th * af); }   // anti-aliasing x2 / x4
            if (gQual < 2) { CGFloat qf = (gQual == 0) ? 0.5 : 0.75; tw = floor(tw * qf); th = floor(th * qf); }   // Graphics Quality : le jeu est rendu plus petit puis etire plein ecran
            if (fabs(tw - sb.width) < 0.5 && fabs(th - sb.height) < 0.5) {
              if (!CGAffineTransformIsIdentity(gv.transform)) { gv.transform = CGAffineTransformIdentity; gv.frame = w.bounds; }
              return;
            }
            if (fabs(gv.bounds.size.width - tw) < 0.5 && fabs(gv.bounds.size.height - th) < 0.5 && !CGAffineTransformIsIdentity(gv.transform)) return;
            gv.transform = CGAffineTransformIdentity;
            gv.bounds = CGRectMake(0, 0, tw, th);
            gv.center = CGPointMake(sb.width / 2, sb.height / 2);
            gv.transform = CGAffineTransformMakeScale(sb.width / tw, sb.height / th);
          }

          // ---------- Noir et blanc ----------
          // Une vue blanche en mode de fusion "saturation" posée au-dessus du jeu (sous le timer, qui garde ses couleurs)
          // ---------- Saturation (0 à 300 %) : filtre sur la vue du jeu, le timer garde ses couleurs ----------
          static void bysgSat(UIWindow *w) {
            Class cf = NSClassFromString(@"CAFilter");
            UIView *rv = w.rootViewController.view;
            if (!cf || !rv) return;
            static CGFloat applied = 1.0;
            static int appliedGm = 0;
            BOOL wantSat = fabs(gSat - 1.0) > 0.001;
            if (!wantSat && !gGmOn) { if (rv.layer.filters.count) rv.layer.filters = nil; applied = 1.0; appliedGm = gGmVer; return; }
            if (fabs(applied - gSat) < 0.0005 && appliedGm == gGmVer && rv.layer.filters.count) return;
            SEL sel = NSSelectorFromString(@"filterWithType:");
            if (![cf respondsToSelector:sel]) return;
            NSMutableArray *fs = [NSMutableArray array];
          #pragma clang diagnostic push
          #pragma clang diagnostic ignored "-Warc-performSelector-leaks"
            if (wantSat) {
              id f = [cf performSelector:sel withObject:@"colorSaturate"];
              if (f) { [f setValue:@(gSat) forKey:@"inputAmount"]; [fs addObject:f]; }
            }
            if (gGmOn) {                                   // Pack graphique : contraste / couleurs / teinte (matrice 4x5)
              id f = [cf performSelector:sel withObject:@"colorMatrix"];
              if (f) {
                NSValue *mv = [NSValue valueWithBytes:gGm objCType:"{CAColorMatrix=ffffffffffffffffffff}"];
                [f setValue:mv forKey:@"inputColorMatrix"];
                [fs addObject:f];
              }
            }
          #pragma clang diagnostic pop
            if (!fs.count) return;
            rv.layer.filters = fs;
            applied = gSat; appliedGm = gGmVer;
          }

          static void bysgGray(UIWindow *w) {
            bysgSat(w);
            if (!gGray && gSatB >= 0.999) { if (grayView.superview) [grayView removeFromSuperview]; return; }
            if (!grayView) {
              grayView = [[UIView alloc] initWithFrame:w.bounds];
              grayView.userInteractionEnabled = NO;
              grayView.backgroundColor = UIColor.whiteColor;
              grayView.layer.compositingFilter = @"saturationBlendMode";
              grayView.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
            }
            if (grayView.superview != w) [w addSubview:grayView];
            grayView.frame = w.bounds;
            grayView.alpha = gGray ? 1.0 : (1.0 - gSatB);
          }

          static UIViewController *topVC(UIWindow *w) {
            UIViewController *v = w.rootViewController;
            while (v.presentedViewController) v = v.presentedViewController;
            return v;
          }

          // ---------- Compteur FPS : on compte les images rendues par le jeu (Metal) ----------
          static volatile int gFr;
          static IMP o_nd;
          static id h_nd(id s, SEL c) { __atomic_fetch_add(&gFr, 1, __ATOMIC_RELAXED); return ((id (*)(id, SEL))o_nd)(s, c); }
          static void bysgInstallFps(void) {
            Class k = NSClassFromString(@"CAMetalLayer");
            Method m = k ? class_getInstanceMethod(k, NSSelectorFromString(@"nextDrawable")) : NULL;
            if (m && !o_nd) { o_nd = method_getImplementation(m); method_setImplementation(m, (IMP)h_nd); }
          }

          // declarations anticipees (Auto Boost / detection) utilisees par le gestionnaire de messages
          static BOOL gABEnabled, gABAuto, gABDbg;
          static void bysgMcConfig(BOOL on, int dirs, int mode, int spd, int dist, NSArray *seq);   // Macro (defini plus bas)
          static BOOL gAQEnabled, gAQEdit;                 // Auto Quit (defini plus bas)
          static int gAQN, gAQDelay, gAQGap;
          static void bysgAQStartEdit(void);
          static void bysgAQTest(void);
          static void bysgKbConfig(BOOL on, int dist, int mode);   // Clavier (defini plus bas)
          static __weak WKWebView *gKbWeb = nil;            // vue web de l'overlay (pour afficher les touches maintenues)
          static int gKbMaskSent = -1;
          static int gBoostSpd, gABN, gABDelay;
          static BOOL gForceFps;
          static void bysgBoostStartEdit(void);
          static void bysgBoostTest(void);
          static void bysgApplyAllFps(void);
          // ---------- Game Hack : invincibilite, no pickup coin, saut infini ----------
          // IL2CPP (dlsym) + points d'arret materiels (hwbphook) : aucune ecriture dans le code du jeu.
          // Les 5 hooks de l'invincibilite + celui du no pickup = 6 points d'arret, le maximum du processeur.
          // Tous les hooks sont poses en UN SEUL appel (hwbp_hook reecrit les registres a chaque appel).
          #include <dlfcn.h>
          #include <mach-o/dyld.h>
          #include "hwbphook.h"
          #include <mach/mach.h>

          static void *(*il_domain_get)(void);
          static void **(*il_dom_asms)(void *, size_t *);
          static void *(*il_asm_image)(void *);
          static void *(*il_cls_from_name)(void *, const char *, const char *);
          static void *(*il_cls_meth)(void *, const char *, int);
          static void *(*il_cls_field)(void *, const char *);
          static void (*il_fld_get)(void *, void *, void *);
          static void (*il_fld_set)(void *, void *, void *);
          static void *(*il_thread_attach)(void *);
          static void *(*il_invoke)(void *, void *, void **, void **);
          static void *(*il_cls_type)(void *);
          static void *(*il_type_obj)(void *);
          static void *(*il_obj_class)(void *);
          static size_t (*il_img_ccount)(void *);
          static void *(*il_img_class)(void *, size_t);
          static const char *(*il_cls_name)(void *);
          static void *(*il_cls_methods)(void *, void **);
          static const char *(*il_meth_name)(void *);
          static uint32_t (*il_meth_pcount)(void *);
          static uint32_t (*il_gch_new)(void *, int);
          static void *(*il_gch_target)(uint32_t);
          static void (*il_gch_free)(uint32_t);

          static void *gh_sym(const char *n) {
            void *p = dlsym(RTLD_DEFAULT, n);
            if (p) return p;
            static void *h;
            if (!h) {
              for (uint32_t i = 0; i < _dyld_image_count(); i++) {
                const char *nm = _dyld_get_image_name(i);
                if (nm && strstr(nm, "UnityFramework")) { h = dlopen(nm, RTLD_NOLOAD | RTLD_LAZY); break; }
              }
            }
            return h ? dlsym(h, n) : NULL;
          }

          static int gh_il_init(void) {
            static int ok = 0;
            if (ok) return 1;
          #define GHS(v, n) do { *(void **)&(v) = gh_sym(n); if (!(v)) return 0; } while (0)
            GHS(il_domain_get, "il2cpp_domain_get");
            GHS(il_dom_asms, "il2cpp_domain_get_assemblies");
            GHS(il_asm_image, "il2cpp_assembly_get_image");
            GHS(il_cls_from_name, "il2cpp_class_from_name");
            GHS(il_cls_meth, "il2cpp_class_get_method_from_name");
            GHS(il_cls_field, "il2cpp_class_get_field_from_name");
            GHS(il_fld_get, "il2cpp_field_get_value");
            GHS(il_fld_set, "il2cpp_field_set_value");
            GHS(il_thread_attach, "il2cpp_thread_attach");
            GHS(il_invoke, "il2cpp_runtime_invoke");
            GHS(il_cls_type, "il2cpp_class_get_type");
            GHS(il_type_obj, "il2cpp_type_get_object");
            GHS(il_obj_class, "il2cpp_object_get_class");
            GHS(il_img_ccount, "il2cpp_image_get_class_count");
            GHS(il_img_class, "il2cpp_image_get_class");
            GHS(il_cls_name, "il2cpp_class_get_name");
            GHS(il_cls_methods, "il2cpp_class_get_methods");
            GHS(il_meth_name, "il2cpp_method_get_name");
            GHS(il_meth_pcount, "il2cpp_method_get_param_count");
            GHS(il_gch_new, "il2cpp_gchandle_new");
            GHS(il_gch_target, "il2cpp_gchandle_get_target");
            GHS(il_gch_free, "il2cpp_gchandle_free");
          #undef GHS
            void *dom = il_domain_get();
            if (!dom) return 0;
            size_t n = 0;
            if (!il_dom_asms(dom, &n) || n < 3) return 0;    // le jeu n'a pas encore charge ses assemblies
            il_thread_attach(dom);
            ok = 1;
            return 1;
          }

          // ns != NULL : recherche exacte ; ns == NULL : on cherche le nom dans toutes les classes (comme clsAny)
          static void *gh_cls(const char *ns, const char *name) {
            void *dom = il_domain_get();
            size_t n = 0;
            void **as = dom ? il_dom_asms(dom, &n) : NULL;
            if (!as) return NULL;
            for (size_t i = 0; i < n; i++) {
              void *img = il_asm_image(as[i]);
              if (!img) continue;
              if (ns) {
                void *k = il_cls_from_name(img, ns, name);
                if (k) return k;
              } else {
                size_t c = il_img_ccount(img);
                for (size_t j = 0; j < c; j++) {
                  void *k = il_img_class(img, j);
                  const char *cn = k ? il_cls_name(k) : NULL;
                  if (cn && !strcmp(cn, name)) return k;
                }
              }
            }
            return NULL;
          }

          static uintptr_t gh_r0(void) { return 0; }   // la methode du jeu est remplacee : elle ne fait rien / renvoie faux
          static uintptr_t gh_r1(void) { return 1; }   // renvoie vrai

          typedef struct { int grp; const char *ns, *cls, *m; int np; void *repl; void *fn; } GHH;
          // grp 1 = invincibilite, grp 2 = no pickup coin (noms et nombres de parametres : table de hooks du frezon-mod)
          static GHH gGhH[] = {
            { 1, "SYBO.Subway", "CharacterStumble", "Stumble", 1, (void *)gh_r0, NULL },
            { 1, "SYBO.Subway", "CharacterStumble", "Kill", 1, (void *)gh_r0, NULL },
            { 1, "SYBO.RunnerCore.Character", "CharacterMotor", "CheckFrontalImpact", 1, (void *)gh_r0, NULL },
            { 1, "SYBO.RunnerCore.Character", "CharacterMotor", "CheckSideImpact", 1, (void *)gh_r0, NULL },
            { 1, "SYBO.RunnerCore.Character", "CharacterCollision", "CanGetOverEdge", 3, (void *)gh_r1, NULL },
            { 2, NULL, "PickupDetector", "PickUpHitPickups", 0, (void *)gh_r0, NULL },
          };
          #define GH_NH ((int)(sizeof(gGhH) / sizeof(gGhH[0])))

          static int gGhWant[3];            // voulu : invincibilite, no pickup coin, saut infini
          static int gGhMask = -1;          // groupes de hooks actuellement poses (-1 = rien pose)
          static void *gGhOld[8], *gGhNew[8];
          static int gGhNOld = 0;
          static int gGhHw = 1;             // 0 si hwbp_hook a echoue
          static char gGhMiss[200];         // methodes introuvables
          static int gGhCnt[3], gGhTot[3];  // hooks poses / attendus : [1] invincibilite, [2] no pickup coin

          // hwbp_unhook ne vide que les threads existants : on vide aussi l'etat par defaut du processus,
          // sinon un thread cree plus tard garderait un point d'arret sur une fonction qui n'est plus hookee (crash).
          static void gh_clear_task_debug(void) {
            arm_debug_state64_t z;
            memset(&z, 0, sizeof(z));
            task_set_state(mach_task_self(), ARM_DEBUG_STATE64, (thread_state_t)&z, ARM_DEBUG_STATE64_COUNT);
          }

          static void gh_resolve(GHH *h) {
            if (h->fn) return;
            void *k = gh_cls(h->ns, h->cls);
            void *mi = k ? il_cls_meth(k, h->m, h->np) : NULL;
            void *fn = mi ? *(void **)mi : NULL;     // MethodInfo->methodPointer
            if (fn) { h->fn = fn; return; }
            size_t l = strlen(gGhMiss);
            if (l + strlen(h->m) + 3 < sizeof(gGhMiss)) snprintf(gGhMiss + l, sizeof(gGhMiss) - l, "%s%s", l ? ", " : "", h->m);
          }

          // pose exactement les hooks des groupes voulus (retire d'abord les anciens). Renvoie 0 si le jeu n'est pas pret.
          static int gh_hooks_apply(void) {
            int mask = (gGhWant[0] ? 1 : 0) | (gGhWant[1] ? 2 : 0);
            if (mask == gGhMask) return 1;
            if (mask && !gh_il_init()) return 0;          // rien a resoudre quand tout est coupe
            if (gGhNOld) { hwbp_unhook(gGhOld, gGhNOld); gGhNOld = 0; gh_clear_task_debug(); }
            gGhCnt[1] = gGhCnt[2] = gGhTot[1] = gGhTot[2] = 0;
            gGhMiss[0] = 0;
            int n = 0;
            for (int i = 0; i < GH_NH; i++) {
              GHH *h = &gGhH[i];
              if (!(mask & h->grp)) continue;
              gGhTot[h->grp]++;
              gh_resolve(h);
              if (h->fn && n < 6) { gGhOld[n] = h->fn; gGhNew[n] = h->repl; n++; gGhCnt[h->grp]++; }
            }
            gGhHw = 1;
            if (n) {
              if (hwbp_hook(gGhOld, gGhNew, n)) gGhNOld = n;
              else { gGhHw = 0; gGhCnt[1] = gGhCnt[2] = 0; gh_clear_task_debug(); }
            }
            gGhMask = mask;
            return 1;
          }

          // ----- saut infini : on rend le "coyote time" du moteur du personnage tres long (+ reset du saut si le jeu en a un) -----
          static void *gGhKMotor, *gGhFind, *gGhFCfg, *gGhReset;
          static uint32_t gGhMH;
          static double gGhMT = -100;
          static float gGhCoy = -1;
          static char gGhJm[160];           // methodes "Jump" vues sur CharacterMotor (diagnostic)
          static char gGhJst[64] = "";      // etat du saut infini pour l'interface

          static void gh_scan_jump(void) {
            gGhJm[0] = 0; gGhReset = NULL;
            void *it = NULL, *m;
            static const char *cand[] = { "ResetJump", "ResetJumpCount", "ResetAirJump", "ResetAirJumps", "ResetDoubleJump", "ResetJumps", "ResetJumpState" };
            while ((m = il_cls_methods(gGhKMotor, &it))) {
              const char *nm = il_meth_name(m);
              if (!nm || !strstr(nm, "Jump")) continue;
              size_t l = strlen(gGhJm);
              if (l + strlen(nm) + 3 < sizeof(gGhJm)) snprintf(gGhJm + l, sizeof(gGhJm) - l, "%s%s", l ? "," : "", nm);
              if (il_meth_pcount(m) == 0)
                for (size_t c = 0; c < sizeof(cand) / sizeof(cand[0]); c++)
                  if (!strcmp(nm, cand[c]) && !gGhReset) gGhReset = m;
            }
          }

          static void *gh_motor(double now) {
            void *o = gGhMH ? il_gch_target(gGhMH) : NULL;
            if (o && now - gGhMT < 1.0) return o;
            if (now - gGhMT < 0.5) return o;
            gGhMT = now;
            if (!gGhKMotor) {
              gGhKMotor = gh_cls("SYBO.RunnerCore.Character", "CharacterMotor");
              if (!gGhKMotor) { snprintf(gGhJst, sizeof(gGhJst), "CharacterMotor introuvable"); return NULL; }
              gGhFCfg = il_cls_field(gGhKMotor, "_config");
              gh_scan_jump();
            }
            if (!gGhFind) {
              void *ko = gh_cls("UnityEngine", "Object");
              gGhFind = ko ? il_cls_meth(ko, "FindObjectsOfType", 1) : NULL;
              if (!gGhFind) { snprintf(gGhJst, sizeof(gGhJst), "FindObjectsOfType introuvable"); return NULL; }
            }
            void *args[1] = { il_type_obj(il_cls_type(gGhKMotor)) };
            void *exc = NULL;
            void *arr = il_invoke(gGhFind, NULL, args, &exc);
            void *first = NULL;
            if (arr && !exc) {
              uintptr_t len = *(uintptr_t *)((char *)arr + 24);      // Il2CppArray : en-tete 16 + bounds 8 -> max_length a +24
              void **v = (void **)((char *)arr + 32);                // elements a +32
              for (uintptr_t i = 0; i < len && i < 8; i++) if (v[i]) { first = v[i]; break; }
            }
            if (gGhMH) { il_gch_free(gGhMH); gGhMH = 0; }
            if (first) gGhMH = il_gch_new(first, 0);
            return first;
          }

          // onlyReset : appel rapide (20 fois / s) = juste le reset du saut ; sinon passe complete (1 fois / s)
          static void gh_jump_apply(double now, int onlyReset) {
            if (!gh_il_init()) { snprintf(gGhJst, sizeof(gGhJst), "il2cpp indisponible"); return; }
            void *mo = gh_motor(now);
            if (!mo) { if (!gGhJst[0] || !strncmp(gGhJst, "ok", 2)) snprintf(gGhJst, sizeof(gGhJst), "en attente d'une partie"); return; }
            if (onlyReset) {
              if (gGhWant[2] && gGhReset) { void *exc = NULL; il_invoke(gGhReset, mo, NULL, &exc); }
              return;
            }
            void *cfg = NULL;
            if (gGhFCfg) il_fld_get(mo, gGhFCfg, &cfg);
            if (!cfg) { snprintf(gGhJst, sizeof(gGhJst), "_config introuvable"); return; }
            void *f = il_cls_field(il_obj_class(cfg), "GroundedTimeExtensionForForgivingJumps");
            if (!f) { snprintf(gGhJst, sizeof(gGhJst), "champ du saut introuvable"); return; }
            float cur = 0;
            il_fld_get(cfg, f, &cur);
            if (gGhWant[2]) {
              if (cur < 100.f) { gGhCoy = cur; float v = 9999.f; il_fld_set(cfg, f, &v); }
              if (gGhReset) snprintf(gGhJst, sizeof(gGhJst), "ok (temps + reset)");
              else snprintf(gGhJst, sizeof(gGhJst), "ok");
            } else if (gGhCoy >= 0 && cur >= 100.f) {
              float o = gGhCoy; il_fld_set(cfg, f, &o); gGhCoy = -1;
              gGhJst[0] = 0;
            }
          }

          static __weak WKWebView *gGhWeb;
          static dispatch_source_t gGhTimer;
          static int gGhTick;
          static NSString *gGhLast;

          static void bysgGhReport(void) {
            WKWebView *w = gGhWeb;
            if (!w) return;
            NSMutableDictionary *o = [NSMutableDictionary dictionary];
            o[@"il"] = @(gh_il_init() ? 1 : 0);
            o[@"hw"] = @(gGhHw);
            o[@"g"] = gGhWant[0] ? [NSString stringWithFormat:@"%d/%d", gGhCnt[1], gGhTot[1]] : @"";
            o[@"c"] = gGhWant[1] ? [NSString stringWithFormat:@"%d/%d", gGhCnt[2], gGhTot[2]] : @"";
            o[@"j"] = gGhWant[2] ? ([NSString stringWithUTF8String:gGhJst] ?: @"") : @"";
            o[@"jm"] = [NSString stringWithUTF8String:gGhJm] ?: @"";
            o[@"m"] = [NSString stringWithUTF8String:gGhMiss] ?: @"";
            NSData *d = [NSJSONSerialization dataWithJSONObject:o options:0 error:nil];
            NSString *js = d ? [[NSString alloc] initWithData:d encoding:NSUTF8StringEncoding] : nil;
            if (!js || [js isEqualToString:gGhLast]) return;
            gGhLast = js;
            [w evaluateJavaScript:[NSString stringWithFormat:@"window.ghr&&ghr(%@)", js] completionHandler:nil];
          }

          // 20 fois par seconde : reset du saut ; 1 fois par seconde : (re)pose des hooks, saut infini, rapport a l'interface
          static void bysgGhTick(void) {
            gGhTick++;
            double now = CACurrentMediaTime();
            if (gGhWant[2] && gGhReset) gh_jump_apply(now, 1);
            if (gGhTick % 20 == 1) {
              gh_hooks_apply();
              if (gGhWant[2] || gGhCoy >= 0) gh_jump_apply(now, 0);
              bysgGhReport();
            }
          }

          // appelee sur le thread principal quand l'interface envoie [invincibilite, no pickup coin, saut infini]
          static void bysgGhConfig(int god, int coin, int jump) {
            gGhWant[0] = god; gGhWant[1] = coin; gGhWant[2] = jump;
            gGhTick = 0;
            if (god || coin || jump) {
              if (!gGhTimer) {
                gGhTimer = dispatch_source_create(DISPATCH_SOURCE_TYPE_TIMER, 0, 0, dispatch_get_main_queue());
                dispatch_source_set_timer(gGhTimer, dispatch_time(DISPATCH_TIME_NOW, 0), 50 * NSEC_PER_MSEC, 5 * NSEC_PER_MSEC);
                dispatch_source_set_event_handler(gGhTimer, ^{ bysgGhTick(); });
                dispatch_resume(gGhTimer);
              }
              bysgGhTick();                                        // applique tout de suite
            } else {
              gh_hooks_apply();                                    // tout coupe : on retire les hooks
              gh_jump_apply(CACurrentMediaTime(), 0);              // et on rend sa valeur au saut
              if (gGhTimer) { dispatch_source_cancel(gGhTimer); gGhTimer = nil; }
              gGhJst[0] = 0;
              bysgGhReport();
            }
          }
