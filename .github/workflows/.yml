              if (result <= mach_absolute_last_time) {
                mach_absolute_base_time = current_time;
                mach_absolute_start_time = mach_absolute_last_time + 1;
                result = mach_absolute_start_time;
              }
            } else {
              mach_absolute_base_time = current_time;
              mach_absolute_start_time = current_time;
              result = current_time;
