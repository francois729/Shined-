          // ---------- Frequence d'images maximale (120 FPS si l'ecran le permet) ----------
          // Force le rythme de tous les CADisplayLink du jeu au maximum de l'ecran. Un iPhone 11 est limite a 60 Hz par son ecran.
          static NSHashTable<CADisplayLink *> *gLinks;
          static void (*o_addRL)(id, SEL, NSRunLoop *, NSRunLoopMode);
          static void (*o_setPFPS)(id, SEL, NSInteger);
          static void bysgApplyRate(CADisplayLink *l) {
            NSInteger mx = UIScreen.mainScreen.maximumFramesPerSecond;
            if (l == boostLink) return;
            if (@available(iOS 15.0, *)) l.preferredFrameRateRange = CAFrameRateRangeMake((float)mx, (float)mx, (float)mx);
            if (o_setPFPS) o_setPFPS(l, @selector(setPreferredFramesPerSecond:), mx); else l.preferredFramesPerSecond = mx;
          }
          static void bysgApplyAllFps(void) { for (CADisplayLink *l in gLinks.allObjects) bysgApplyRate(l); }
          static void h_addRL(id self, SEL _cmd, NSRunLoop *rl, NSRunLoopMode m) {
            if (!gLinks) gLinks = [NSHashTable weakObjectsHashTable];
            [gLinks addObject:self];
            if (gForceFps) bysgApplyRate(self);
            o_addRL(self, _cmd, rl, m);
          }
          static void h_setPFPS(id self, SEL _cmd, NSInteger v) {
            if (gForceFps && self != boostLink) v = UIScreen.mainScreen.maximumFramesPerSecond;
            o_setPFPS(self, _cmd, v);
          }
          static void bysgInstallForceFps(void) {
            Method m1 = class_getInstanceMethod(CADisplayLink.class, @selector(addToRunLoop:forMode:));
            if (m1) { o_addRL = (void *)method_getImplementation(m1); method_setImplementation(m1, (IMP)h_addRL); }
            Method m2 = class_getInstanceMethod(CADisplayLink.class, @selector(setPreferredFramesPerSecond:));
            if (m2) { o_setPFPS = (void *)method_getImplementation(m2); method_setImplementation(m2, (IMP)h_setPFPS); }
          }

          __attribute__((constructor)) static void bysg_init(void) {
            bysgInstallFps();
            bysgInstallAudio();
            bysgInstallMap();
            bysgInstallForceFps();
            dispatch_async(dispatch_get_main_queue(), ^{
              __block int lastN = 0;
              __block CFAbsoluteTime lastT = CFAbsoluteTimeGetCurrent();
              [NSTimer scheduledTimerWithTimeInterval:1.0 repeats:YES block:^(NSTimer *t) {
                int n = gFr;
                CFAbsoluteTime now = CFAbsoluteTimeGetCurrent();
                double dt = now - lastT;
                int d = n - lastN;
                lastN = n; lastT = now;
                if (host && d > 0 && dt > 0.2)
